name: Link Checker

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

  schedule:
    - cron: "00 18 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.204.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Install dependencies
        run: |
            bundle install

      - name: Build with Jekyll
          # Outputs to the './_site' directory by default
        run: |
            bundle exec jekyll build
        env:
            PAGES_REPO_NWO: ${{ github.repository }}
            JEKYLL_BUILD_BRANCH: ${{ github.ref_name }}
            JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
            lycheeVersion: v0.24.2
            args: >-
              --root-dir "${{ github.workspace }}/_site"
              --fallback-extensions html
              --exclude '^https://github\.com'
              --github-token ${{ secrets.GITHUB_TOKEN }}
              _site/
            # Don't fail the action on broken links (handled below instead)
            fail: false

      # lychee exit codes: 0 = ok, 1 = runtime error, 2 = broken links, 3 = bad config.
      # Without this, a lychee invocation error was swallowed by `fail: false` and the
      # job went green while filing an empty report.
      - name: Fail on link checker error
        if: steps.lychee.outputs.exit_code == 1 || steps.lychee.outputs.exit_code == 3
        run: |
            echo "::error::lychee failed to run (exit code ${{ steps.lychee.outputs.exit_code }}). See the 'Link Checker' step log."
            exit 1

      - name: Add page URL
        if: steps.lychee.outputs.exit_code == 2
        run: |
            DEPLOY_URL="https://plan.research-data.no/pages/"
            test -s ./lychee/out.md || { echo "::error::lychee produced no report"; exit 1; }
            sed -i "s|### Errors in _site/|### Errors in ${DEPLOY_URL}|g" ./lychee/out.md
            cat ./lychee/out.md

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code == 2 && github.repository_owner == 'DHP-stottepakke'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
          issue-number: 166
